name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 11 }
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r17c }
      - name: Instalar libtinfo5
        run: |
          sudo apt-get update
          sudo apt-get install -y libncurses5 libtinfo5
      - name: Arreglar mayusculas de includes
        run: bash fixcase.sh
      - name: Compilar JNI (libsamp.so)
        run: |
          cd "Jni source"
          "${{ steps.ndk.outputs.ndk-path }}/ndk-build" -j4
          cd ..
          mkdir -p app/jniLibs/armeabi-v7a
          cp "Jni source/libs/armeabi-v7a/libsamp.so" app/jniLibs/armeabi-v7a/
      - name: Build APK
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: app/build/outputs/apk/debug/*.apk
